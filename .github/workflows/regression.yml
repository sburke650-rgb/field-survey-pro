name: Regression
on:
  pull_request:
  push:
    branches: [main, 'safeguards/**', 'fix/**']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Publish test evidence (including known defects)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
